    ${curs.length > 1 ? `<div class="field" style="padding-bottom:10px"><label>Mata uang budget</label><div class="chips" style="margin-top:6px;flex-wrap:wrap">${curs.map(c => `<button class="chip ${c === budCur() ? 'on' : ''}" data-bcur="${c}">${c}</button>`).join('')}</div></div>` : ''}
    ${curs.length > 1 ? rateInfo() : ''}
    ${miss.length ? `<div class="hint">${missNote(miss)}</div>` : ''}
    <div class="card list" style="padding:4px 16px">${outs.map(c => `<button class="row" data-budget="${c.id}"><span class="ic">${esc(c.icon)}</span><span class="tx1">${esc(c.name)}${by[c.id] ? `<br><span class="small muted num">Terpakai ${fmtB(by[c.id])}</span>` : ''}</span><span class="num ${S.budgets[c.id] > 0 ? '' : 'muted'}">${S.budgets[c.id] > 0 ? fmtB(S.budgets[c.id]) : 'Atur'}</span><span class="chev">›</span></button>`).join('')}</div>`);
}
function setBudgetCur(nc) {
  const oc = budCur(); if (nc === oc) return;
  let kept = 0;
  for (const k of Object.keys(S.budgets)) {
    const v = convert(S.budgets[k], oc, nc);
    if (v == null) kept++; else S.budgets[k] = roundC(v, nc);
  }
  S.budgetCur = nc; save(); render(); openBudgetList();
  toast(kept ? `Budget sekarang dalam ${nc}. ${kept} nominal belum bisa dikonversi (kurs belum ada), cek lagi ya.` : `Budget sekarang dalam ${nc}`);
}

// Budget form
function openBudget(cid) {
  const c = catById(cid), bc = budCur(), cur = S.budgets[cid] || 0;
  openSheet(`
    <div class="shead"><button data-close>Batal</button><h2>${esc(c.icon)} ${esc(c.name)}</h2><button id="bSave" style="font-weight:600">Simpan</button></div>
    <div class="field amount"><label>Budget per bulan (${bc})</label><div class="ar"><span class="rp">${curLabel(bc)}</span><input id="bAmt" inputmode="${amtMode(bc)}" class="num" placeholder="0" value="${fmtInput(cur, bc)}"></div></div>
    <div class="hint">Kosongkan atau isi 0 untuk menghapus budget kategori ini. Mata uang budget bisa diganti di menu Atur budget.</div>
    <button class="btn" id="bSave2">Simpan</button>`);
  const a = $('#bAmt'); bindAmt(a, bc);
  setTimeout(() => { try { a.focus(); } catch (e) {} }, 320);
  $('#bSave').onclick = $('#bSave2').onclick = () => {
    const v = parseAmt(a.value, bc); if (v > 0) S.budgets[cid] = v; else delete S.budgets[cid];
    save(); closeSheet(); render(); toast(v > 0 ? 'Budget disimpan' : 'Budget dihapus');
  };
}

// ---------- Export / import ----------
async function deliverFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {}
  // Cadangan: tampilkan teks agar bisa disalin
  openSheet(`<div class="shead"><button data-close>Tutup</button><h2>${esc(name)}</h2><span style="width:40px"></span></div>
    <p class="small muted">Kalau file tidak tersimpan otomatis, salin teks di bawah ini.</p>
    <textarea class="dump" readonly>${esc(text)}</textarea><button class="btn sec" id="copyDump">Salin</button>`);
  $('#copyDump').onclick = async () => { try { await navigator.clipboard.writeText(text); toast('Tersalin'); } catch (e) { $('.dump').select(); toast('Pilih semua lalu salin manual'); } };
}
function exportCsv() {
  const rows = [['Tanggal', 'Jenis', 'Kategori', 'Dompet', 'Nominal', 'Mata Uang', 'Ke Dompet', 'Diterima', 'Mata Uang Tujuan', 'Status', 'Catatan'].map(tr)];
  const pend = pendingCC();
  for (const t of sortTx(S.tx).reverse()) {
    const fc = curOf(t.wallet), tf = t.type === 'transfer', tc = tf ? curOf(t.toWallet) : '';
    rows.push([t.date, t.type === 'in' ? 'Pemasukan' : t.type === 'out' ? 'Pengeluaran' : 'Transfer', tf ? '' : catById(t.cat).name,
      walById(t.wallet).name, t.amount, fc, tf ? walById(t.toWallet).name : '', tf ? inAmt(t) : '', tc,
      pend.has(t.id) ? 'Belum lunas (CC)' : '', t.note || '']);
  }
  const csv = '﻿' + rows.map(r => r.map(v => { const s = String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
  deliverFile(`dompetku-${slugName()}-${todayStr()}.csv`, csv, 'text/csv');
}
const slugName = () => (activeSpace().name || 'space').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'space';
function exportJson() { deliverFile(`dompetku-${slugName()}-backup-${todayStr()}.json`, JSON.stringify(S, null, 1), 'application/json'); }
$('#photoIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !D) return;
  const pb = $('#photoBtn');
  if (pb) { pb.disabled = true; pb.textContent = '⏳'; }
  try {
    const image = await fileToJpegB64(f);
    const j = await api('parse', { image, mime: 'image/jpeg', categories: catsPayload() });
    const r = j.data || {};
    syncFields();
    D.type = r.type === 'in' ? 'in' : 'out';
    D.wallet = mapWallet(r.app, r.currency);
    D.amount = roundC(r.amount, curOf(D.wallet)); D.raw = { amount: rawOf(D.amount) }; D.qrest = null;
    D.cat = mapCat(r.category, D.type);
    D.note = r.merchant || r.note || D.note;
    D.date = saneDate(r.date, todayStr());
    if (r.date && D.date !== r.date) setTimeout(() => toast('Tanggal di struk tidak jelas, jadi dipakai tanggal hari ini. Ubah kalau perlu.'), 2400);
    if (r.currency && r.currency !== curOf(D.wallet)) setTimeout(() => toast(`Struk dalam ${r.currency}, tapi tidak ada dompet ${r.currency}. Cek nominal & dompetnya.`), 2200);
    D.src = 'foto';
    renderTxSheet();
    toast('Terbaca ✅ Cek dulu, lalu Simpan');
  } catch (err) {
    toast(err.message);
    if (pb) { pb.disabled = false; pb.textContent = '📷'; }
  }
});

function openSync() {
  const c = getSync();
  openSheet(`
    <div class="shead"><button data-close>Batal</button><h2>Otomatis</h2><span style="width:40px"></span></div>
    <p class="small muted" style="margin:0 4px 12px;line-height:1.5">Hubungkan ke backend Google Apps Script milikmu supaya Back Tap, foto struk, dan backup ke Google Sheets bisa jalan. Langkahnya ada di file <b>PANDUAN-OTOMATIS.md</b>.</p>
    <div class="field"><label>URL Web App (…/exec)</label><input id="sUrl" value="${esc(c.url || '')}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label>Token</label><input id="sTok" value="${esc(c.token || '')}" placeholder="dari Execution log setup()" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
    ${getSpaces().list.length > 1 ? `<div class="field"><label>Back Tap masuk ke space</label><select id="sSpace">${getSpaces().list.map(x => `<option value="${x.id}" ${x.id === (c.space || getSpaces().list[0].id) ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>` : ''}
    <div class="field"><label>Dompet default untuk Back Tap</label><select id="sWal"></select></div>
    <div class="hint">Kalau nama aplikasi pembayar (mis. GoPay, BCA) cocok dengan nama salah satu dompetmu, transaksi otomatis masuk ke dompet itu. Kalau tidak cocok, masuk ke dompet default ini.</div>
    <button class="btn" id="sSave">Simpan & tes koneksi</button>
    ${c.url ? '<button class="btn ghost" id="sOff">Putuskan koneksi</button>' : ''}`);
  const fillWal = () => {
    const sid = $('#sSpace') ? $('#sSpace').value : getSpaces().list[0].id;
    const ws = sid === getSpaces().active ? S.wallets : loadSpace(sid).wallets;
    $('#sWal').innerHTML = ws.map(w => `<option value="${w.id}" ${w.id === c.wallet ? 'selected' : ''}>${esc(w.icon)} ${esc(w.name)}${w.currency !== mainCur() ? ' (' + w.currency + ')' : ''}</option>`).join('');
    trDOM($('#sWal'));
  };
  fillWal();
  if ($('#sSpace')) $('#sSpace').onchange = fillWal;
  $('#sSave').onclick = async () => {
    const url = $('#sUrl').value.trim(), token = $('#sTok').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { toast('URL harus dari script.google.com'); return; }
    if (!token) { toast('Isi token'); return; }
    setSync(Object.assign(getSync(), { url, token, wallet: $('#sWal').value, space: $('#sSpace') ? $('#sSpace').value : getSpaces().list[0].id }));
    const b = $('#sSave'); b.disabled = true; b.textContent = tr('Menghubungkan…');
    try {
      const j = await api('ping');
      closeSheet(); render();
      toast(j.gemini ? 'Terhubung ✅' : 'Terhubung, tapi GEMINI_API_KEY belum diisi');
      pullInbox(true); doBackup(false);
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = tr('Simpan & tes koneksi'); }
  };
  if ($('#sOff')) $('#sOff').onclick = async () => {
    if (await ask('Putuskan koneksi? Back Tap, foto, dan backup otomatis berhenti. Data di HP tetap aman.', 'Putuskan')) { setSync({}); closeSheet(); render(); toast('Koneksi diputus'); }
  };
}

$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.tx) || !Array.isArray(d.wallets)) throw new Error('bad');
    if (await ask(`Pulihkan ${d.tx.length} transaksi dari backup ke space "${activeSpace().name}"? Data space ini akan diganti.`, 'Pulihkan')) {
      S = normalize(Object.assign(defaults(), d)); save(); render(); toast('Data dipulihkan');
    }
  } catch (err) { toast('File backup tidak valid'); }
});

// ---------- Events ----------
document.addEventListener('click', async e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.matches('[data-close]')) { closeSheet(); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.goto) { e.preventDefault(); tab = t.dataset.goto; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.edit) { openTx(t.dataset.edit); return; }
  if (t.dataset.wallet && !t.closest('#sheet')) { openWallet(t.dataset.wallet); return; }
  if (t.dataset.cat && !t.closest('#sheet')) { openCat(t.dataset.cat); return; }
  if (t.dataset.budget) { openBudget(t.dataset.budget); return; }
  if (t.dataset.day) { openDaySheet(t.dataset.day); return; }
  if (t.dataset.catd) { openCatDetail(t.dataset.catd); return; }
  if (t.dataset.wdet) { openWalletDetail(t.dataset.wdet); return; }
  if (t.dataset.htype) { homeType = t.dataset.htype; render(); return; }
  if (t.dataset.vcur) { viewCur = t.dataset.vcur; render(); return; }
  if (t.dataset.bcur) { setBudgetCur(t.dataset.bcur); return; }
  if (t.id === 'budAll' || t.id === 'budAll2' || t.id === 'budAll3') { e.preventDefault(); openBudgetList(); return; }
  if (t.id === 'mainCurBtn') { openMainCur(); return; }
  if (t.id === 'langBtn') { openLang(); return; }
  if (t.dataset.lang) { try { localStorage.setItem(KEY + '.lang', t.dataset.lang); } catch (er) {} if (t.dataset.lang !== LANG) location.reload(); else closeSheet(); return; }
  if (t.id === 'spaceBtn' || t.id === 'spaceBtn2') { openSpaces(); return; }
  if (t.id === 'spaceAdd') { openSpaceForm(null); return; }
  if (t.dataset.space) { switchSpace(t.dataset.space); return; }
  if (t.dataset.spedit) { openSpaceForm(t.dataset.spedit); return; }
  if (t.dataset.mcur) { S.mainCur = t.dataset.mcur; viewCur = t.dataset.mcur; save(); closeSheet(); render(); toast(`Mata uang utama: ${t.dataset.mcur}`); return; }
  if (t.id === 'tglBudget') { S.budgetOn = !budgetOn(); save(); render(); toast(S.budgetOn ? 'Budget diaktifkan' : 'Budget dimatikan. Data budget tetap tersimpan.'); return; }
  if (t.dataset.filter) { histFilter = t.dataset.filter; document.querySelectorAll('[data-filter]').forEach(x => x.classList.toggle('on', x === t)); $('#hList').innerHTML = histList(); trDOM($('#hList')); return; }
  if (t.id === 'tipClose') { try { localStorage.setItem(KEY + '.tip', '1'); } catch (er) {} render(); return; }
  if (t.id === 'syncSet') { openSync(); return; }
  if (t.id === 'syncPull') { pullInbox(true); return; }
  if (t.id === 'syncBackup') { doBackup(true); return; }
  if (t.id === 'syncRestore') {
    try {
      const j = await api('restore', { space: spaceInfo() });
      const d = j.data;
      if (!d || !Array.isArray(d.tx)) throw new Error('Backup di Drive tidak valid');
      if (await ask(`Pulihkan ${d.tx.length} transaksi dari Google Drive ke space "${activeSpace().name}"? Data space ini di HP akan diganti.`, 'Pulihkan')) {
        S = normalize(Object.assign(defaults(), d)); save(); render(); toast('Data dipulihkan dari Drive');
      }
    } catch (er) { toast(er.message); }
    return;
  }
  if (t.id === 'expCsv') { exportCsv(); return; }
  if (t.id === 'expJson') { exportJson(); return; }
  if (t.id === 'impJson') { $('#fileIn').click(); return; }
  if (t.id === 'wipe') {
    if (await ask('Hapus SEMUA transaksi, dompet, dan pengaturan? Tindakan ini tidak bisa dibatalkan. Sebaiknya backup dulu.', 'Hapus semua')) { S = defaults(); save(); render(); toast('Semua data dihapus'); }
  }
});
document.addEventListener('input', e => { if (e.target.id === 'hSearch') { histQuery = e.target.value; $('#hList').innerHTML = histList(); trDOM($('#hList')); } });
$('#addBtn').addEventListener('click', () => openTx(null));
$('#mPrev').addEventListener('click', () => { viewYM = ymShift(viewYM, -1); render(); });
$('#mNext').addEventListener('click', () => { viewYM = ymShift(viewYM, 1); render(); });

runRecurring();
render();

// Tarik transaksi Back Tap saat aplikasi dibuka / kembali ke layar
pullInbox(false);
try { if (localStorage.getItem(spaceKey(getSpaces().active) + '.dirty') === '1') doBackup(false); } catch (e) {}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pullInbox(false); });
window.addEventListener('online', () => { lastPull = 0; pullInbox(false); });

// ---------- Offline (service worker) ----------
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  // Versi baru aktif → muat ulang sekali supaya tampilan terbaru langsung muncul
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(r => { try { r.update(); } catch (e) {} }).catch(() => {});
  });
}
})();
</script>
