<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dompetku</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dompetku">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--text:#111827;--muted:#6B7280;--line:#E5E7EB;
  --accent:#0F766E;--accent-2:#14B8A6;--accent-soft:#E6F4F1;--red:#DC2626;--green:#15803D;
  --chip:#EEF0F3;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1C1C1E;--text:#F3F4F6;--muted:#9CA3AF;--line:#2C2C2E;
  --accent:#2DD4BF;--accent-2:#5EEAD4;--accent-soft:#0F2F2C;--red:#F87171;--green:#4ADE80;--chip:#2C2C2E;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);padding:calc(var(--sat) + 10px) 18px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.month{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.month button{width:30px;height:30px;border-radius:50%;font-size:18px;color:var(--accent)}
.month button:active{background:var(--chip)}
.month span{font-size:14px;font-weight:600;min-width:108px;text-align:center}

main{padding:4px 16px calc(96px + var(--sab))}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card h3 a,.link{color:var(--accent);font-weight:500;font-size:14px;text-decoration:none}
.muted{color:var(--muted)}
.small{font-size:13px}

.hero{background:linear-gradient(135deg,#0F766E,#115E59);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:2px 0 14px}
.hero .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .split div{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.hero .split b{display:block;font-size:16px;margin-top:2px}

.wallets{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.wallets::-webkit-scrollbar{display:none}
.wal{flex:0 0 auto;min-width:136px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);text-align:left}
.wal .ic{font-size:20px}
.wal .nm{font-size:13px;color:var(--muted);margin-top:4px}
.wal .bl{font-weight:600;margin-top:2px}

.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{flex:0 0 120px;position:relative}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .ctr b{font-size:13px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px}
.lg i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.lg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg em{font-style:normal;color:var(--muted)}

.tx{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.tx+.tx{border-top:1px solid var(--line)}
.tx .ti{width:40px;height:40px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.tx .tm{flex:1;min-width:0}
.tx .tm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .tm span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tx .ta{font-weight:600;white-space:nowrap}
.out{color:var(--text)}.in{color:var(--green)}.tf{color:var(--muted)}

.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:16px 4px 6px;font-weight:500}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
.empty .e{font-size:34px;margin-bottom:6px}

.search{width:100%;border:0;background:var(--card);border-radius:12px;padding:11px 14px;margin-bottom:10px;box-shadow:var(--shadow);outline:none}
.chips{display:flex;gap:8px;margin-bottom:4px}
.chip{padding:7px 14px;border-radius:999px;background:var(--card);font-size:14px;box-shadow:var(--shadow)}
.chip.on{background:var(--accent);color:#fff}

.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent-2)}
.bar i.warn{background:#F59E0B}.bar i.over{background:var(--red)}
.brow{padding:12px 0;width:100%;text-align:left;display:block}
.brow+.brow{border-top:1px solid var(--line)}
.brow .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brow .top b{font-weight:500}
.brow .sub{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}

.list .row{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.list .row+.row{border-top:1px solid var(--line)}
.list .row .ic{font-size:20px;width:28px;text-align:center}
.list .row .tx1{flex:1}
.list .row .chev{color:var(--muted)}
.danger{color:var(--red)!important}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sab))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .add{align-self:center}
nav.tabs .add span{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:300;box-shadow:0 6px 18px rgba(15,118,110,.35);margin-top:-18px}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;padding:8px 16px calc(20px + var(--sab));-webkit-overflow-scrolling:touch}
.sheet.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.shead h2{font-size:18px;margin:0}
.shead button{color:var(--accent);font-size:15px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{padding:8px 0;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{background:var(--card);border-radius:14px;padding:4px 14px;margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);padding-top:8px}
.field input,.field select{width:100%;border:0;background:transparent;padding:4px 0 10px;outline:none;font-size:16px;-webkit-appearance:none;appearance:none}
.amount input{font-size:32px;font-weight:700;letter-spacing:-.02em}
.amount .rp{font-size:20px;font-weight:600;color:var(--muted);margin-right:4px}
.amount .ar{display:flex;align-items:baseline}
.quick{display:flex;align-items:center;gap:8px}
.quick input{flex:1}
.hint{font-size:12px;color:var(--muted);margin:-4px 4px 10px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.cat{background:var(--card);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;line-height:1.2;text-align:center;border:2px solid transparent}
.cat .ce{font-size:22px}
.cat.on{border-color:var(--accent);background:var(--accent-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;background:var(--accent);color:#fff;font-weight:600;border-radius:14px;padding:15px;font-size:16px;margin-top:6px}
.btn:active{opacity:.85}
.btn.ghost{background:var(--card);color:var(--red)}
.btn.sec{background:var(--card);color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.dialog{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);padding:24px}
.dialog.show{display:flex}
.dialog .box{background:var(--card);border-radius:18px;padding:20px;max-width:320px;width:100%;text-align:center}
.dialog .box p{margin:0 0 16px;line-height:1.4}
.dialog .box .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dialog .box button{padding:12px;border-radius:12px;background:var(--chip);font-weight:600}
.dialog .box button.ok{background:var(--red);color:#fff}
.banner{background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.banner b{color:var(--accent)}
.banner button{margin-left:auto;color:var(--muted);font-size:18px;line-height:1}
.pend{display:block;font-size:11px;font-weight:600;color:#B45309;margin-top:2px}
@media (prefers-color-scheme:dark){.pend{color:#FBBF24}}
.wal.cc{background:linear-gradient(135deg,#1F2937,#374151);color:#fff}
.wal.cc .nm,.wal.cc .muted{color:rgba(255,255,255,.7)}
.cc-line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:13px;margin:-6px 0 14px;opacity:.95}
.cc-line span{opacity:.8}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:-2px 4px 10px}
/* Ringkasan budget di beranda */
.bsum{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2px}
.bsum b{display:block;font-size:20px;letter-spacing:-.01em;margin-top:1px}
/* Kurs di form transfer */
.field.rate .ar{align-items:baseline;flex-wrap:nowrap}
.field.rate .rp{flex:0 0 auto;white-space:nowrap}
.field.rate input{font-size:26px}
.amount .ar input{flex:1;min-width:0}
.hero .big2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:-10px 0 14px;opacity:.95}
.hero .big2 + .big2{margin-top:-10px}
.curchips{align-items:center;margin:0 0 12px}
.curchips .small{margin-left:auto}
/* Space */
.spacebtn{display:inline-flex;align-items:center;gap:8px;padding:2px 10px 2px 2px;border-radius:99px;margin:0 0 6px -2px;color:var(--muted);font-size:15px;font-weight:500}
.spacebtn:active{background:var(--chip)}
.spacebtn .caret{font-size:11px}
.sav{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:0 0 auto}
.sav.big{width:38px;height:38px;font-size:16px}
.sprow{padding:0!important}
.spsel{flex:1;display:flex;align-items:center;gap:12px;padding:12px 0;text-align:left}
.spedit{padding:10px 4px 10px 12px;font-size:16px}
.spcolors{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.spc{width:32px;height:32px;border-radius:50%}
.spc.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
/* Pemilih ikon */
.iconpick{display:block;text-align:left;width:100%;position:relative;margin-bottom:10px}
.iconpick .iv{display:block;font-size:24px;padding:2px 0 8px}
.iconpick .caret{position:absolute;right:12px;bottom:14px;color:var(--muted);font-size:12px;transition:transform .2s}
.iconpick.open{box-shadow:0 0 0 2px var(--accent) inset}
.iconpick.open .caret{transform:rotate(180deg)}
.icongrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border-radius:14px;padding:10px;margin:-2px 0 10px}
.icongrid[hidden]{display:none}
.ig{font-size:22px;aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center}
.ig.on{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
/* Switch on/off */
.sw{flex:0 0 auto;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:#34C759}
.sw.on::after{transform:translateX(20px)}
/* Periode ini */
.period h3{margin-bottom:4px}
.pdonut{position:relative;width:168px;height:168px;margin:6px auto 14px}
.pdonut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pdonut .ctr b{font-size:28px;line-height:1.1}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:6px}
.seg2 button{padding:10px 0;border-radius:11px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.seg2 button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.15)}
@media (prefers-color-scheme:dark){.seg2 button.on{background:#000}}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.dot.r{background:#E11D48}.dot.g{background:#16A34A}
.bmini{background:var(--chip);border-radius:12px;padding:10px 12px;margin:10px 0 2px;font-size:13px}
.bmini>div:first-child{display:flex;justify-content:space-between;gap:8px}
.bmini em{display:block;font-style:normal;color:var(--muted);font-size:12px}
.bmini b{font-size:15px}
.bmini .bar{margin-top:7px;background:var(--bg)}
.clist .crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.cic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;background:var(--chip)}
.cic.ccic{background:linear-gradient(135deg,#1F2937,#4B5563)}
.cmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cmid b{font-weight:500}
.bar.thin{height:4px;margin-top:5px;max-width:200px}
.cr{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap}
.cr b{font-weight:600}
/* Analytics */
.chart{width:100%;height:auto;display:block;margin:2px 0 8px}
.chart .gl{stroke:var(--line);stroke-dasharray:3 4}
.chart .ax{fill:var(--muted);font-size:10px;font-family:inherit}
.chart .bo{fill:#E11D48}.chart .bi{fill:#16A34A}
.lgd{font-weight:500;display:flex;align-items:center;gap:4px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.cmp>div{display:flex;flex-direction:column;gap:3px}
.cmp b{font-size:22px;letter-spacing:-.01em}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid div{background:var(--chip);border-radius:12px;padding:10px 12px}
.fgrid span{display:block;font-size:12px;color:var(--muted)}
.fgrid b{font-weight:600}
.wlist .row .tx1{line-height:1.35}
/* Grid dompet */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.wgrid .wal{min-width:0}
.wal .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wal.addw{display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:600;min-height:92px}
/* Kalender */
.cal{padding:16px 12px 14px}
.cal h3{padding:0 4px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ch{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 6px}
.cd{position:relative;min-height:62px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;border:1.5px solid transparent}
.cd .dn{font-size:14px;font-weight:500}
.cd .da{font-size:11px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.cd .dc{font-size:10px;min-width:17px;height:17px;line-height:17px;border-radius:9px;background:var(--bg);color:var(--muted);margin-top:auto}
.cd.has{background:color-mix(in srgb,var(--accent-2) calc(var(--heat) * 34%),var(--chip))}
.cd.oth .dn{color:var(--muted);opacity:.45}
.cd.today{border-color:var(--text)}
.cd.sel{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
textarea.dump{width:100%;height:140px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px;font-family:ui-monospace,monospace;font-size:12px}
/* ================================================================
   SKIN v2 · "Kas jade"
   Ide: buku kas pribadi bernuansa uang kertas. Satu elemen yang diingat:
   kartu saldo hijau-giok dengan guilloche halus seperti cetakan uang;
   sisanya tenang, rapi, angka tabular.
   ================================================================ */
:root{
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --bg:#EDF1EE; --card:#FFFFFF; --chip:#F1F5F2; --text:#0F1A16; --muted:#5F6E67; --line:#DFE6E1;
  --accent:#0C8A62; --accent-2:#22B884; --accent-soft:#DCF2E8; --on-accent:#FFFFFF;
  --red:#D2453C; --green:#0E8A5D; --gold:#B87B0B;
  --hero-a:#0B3A2D; --hero-b:#0F5843; --hero-ink:#ECF8F2;
  --dock:rgba(255,255,255,.86); --shadow:none;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A100E; --card:#121A17; --chip:#1A2420; --text:#EAF1ED; --muted:#8A9891; --line:#202C27;
    --accent:#3DDBA4; --accent-2:#35C995; --accent-soft:#10302A; --on-accent:#05251B;
    --red:#FF7A6E; --green:#4FE0A8; --gold:#F2B544;
    --hero-a:#0B3A2D; --hero-b:#0F5843; --hero-ink:#ECF8F2;
    --dock:rgba(22,31,28,.82); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A100E; --card:#121A17; --chip:#1A2420; --text:#EAF1ED; --muted:#8A9891; --line:#202C27;
  --accent:#3DDBA4; --accent-2:#35C995; --accent-soft:#10302A; --on-accent:#05251B;
  --red:#FF7A6E; --green:#4FE0A8; --gold:#F2B544;
  --dock:rgba(22,31,28,.82); color-scheme:dark;
}

html,body{font-family:var(--font);background:var(--bg);color:var(--text);letter-spacing:-.005em}
.num,.tx .ta,.cr b,.hero b,.bsum b,.fgrid b{font-variant-numeric:tabular-nums lining-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Header */
header{padding:calc(var(--sat) + 8px) 18px 12px;background:color-mix(in srgb,var(--bg) 86%,transparent)}
h1{font-size:30px;font-weight:800;letter-spacing:-.035em}
.spacebtn{font-size:14px;font-weight:600;color:var(--text);background:var(--card);border:1px solid var(--line);padding:3px 12px 3px 3px;margin:0 0 10px}
.spacebtn .caret{color:var(--muted)}
.month{background:var(--card);border:1px solid var(--line);box-shadow:none}
.month span{font-weight:700;font-size:13.5px}
.month button{color:var(--text)}

/* Kartu umum: radius besar untuk seksi, kecil untuk isi */
main{padding:2px 16px calc(112px + var(--sab))}
.card{border-radius:24px;border:1px solid var(--line);box-shadow:none;padding:18px}
.card h3{font-size:16px;font-weight:700;letter-spacing:-.015em;margin-bottom:14px}
.card h3 .small,.card h3 .muted{font-weight:500!important}
.small{font-size:12.5px}

/* Kartu saldo: satu-satunya elemen yang "berbunyi" */
.hero{position:relative;overflow:hidden;color:var(--hero-ink);border-radius:28px;padding:20px 20px 18px;margin-bottom:14px;
  background:
    repeating-radial-gradient(circle at 112% -18%, rgba(255,255,255,.075) 0 1px, transparent 1px 9px),
    repeating-radial-gradient(circle at -20% 120%, rgba(255,255,255,.05) 0 1px, transparent 1px 11px),
    radial-gradient(120% 90% at 85% 0%, #157257 0%, transparent 55%),
    linear-gradient(160deg,var(--hero-a),var(--hero-b));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), 0 18px 40px -24px rgba(6,40,30,.7)}
.hero::after{content:"";position:absolute;inset:8px;border-radius:21px;border:1px solid rgba(255,255,255,.07);pointer-events:none}
.hero .lbl{font-size:12.5px;font-weight:600;opacity:.78;display:flex;align-items:center;gap:7px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:8px 0 6px}
.hero .big2{font-size:18px;font-weight:700;letter-spacing:-.02em;opacity:.82;margin:0 0 4px!important}
.hero .big2 + .big2{margin-top:0!important}
.hero .split{gap:8px;margin-top:16px}
.hero .split>div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:11px 12px;backdrop-filter:blur(2px)}
.hero .split b{font-size:15.5px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.flow{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.flow svg{width:12px;height:12px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.flow.in{background:rgba(79,224,168,.18)}.flow.in svg{stroke:#6FF0BE}
.flow.out{background:rgba(255,122,110,.18)}.flow.out svg{stroke:#FF9B91}
.cc-line{margin:6px 0 2px;padding:9px 12px;border-radius:14px;background:rgba(0,0,0,.18);opacity:1}

/* Pilihan mata uang & chips */
.chips{gap:6px}
.chip{background:var(--card);border:1px solid var(--line);box-shadow:none;font-weight:600;font-size:13.5px;padding:7px 14px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.curchips .small{font-weight:500}

/* Segmented control */
.seg,.seg2{background:var(--chip);border-radius:14px}
.seg button.on,.seg2 button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.seg2 button{font-weight:600}
.dot{border-radius:50%;width:8px;height:8px}
.dot.r{background:var(--red)}.dot.g{background:var(--green)}

/* Periode ini */
.pdonut .ctr b{font-size:32px;font-weight:800;letter-spacing:-.03em}
.clist .crow{padding:13px 0}
.cic{border-radius:14px;width:44px;height:44px}
.cmid b{font-weight:600;letter-spacing:-.01em}
.cr b{font-weight:700;letter-spacing:-.01em}
.bmini{background:var(--chip);border-radius:16px;padding:12px 14px}
.bmini b{font-weight:800!important}
.bar{background:color-mix(in srgb,var(--text) 9%,transparent);height:7px}
.bar i{background:var(--accent-2)}
.bar i.warn{background:var(--gold)}.bar i.over{background:var(--red)}

/* Analytics */
.chart .bo{fill:var(--red)}.chart .bi{fill:var(--green)}
.cmp b{font-size:24px;font-weight:800;letter-spacing:-.03em}
.cmp b.in{color:var(--green)}.cmp b.danger{color:var(--red)}

/* Transaksi & daftar */
.tx{padding:12px 0}
.tx .ti{width:44px;height:44px;border-radius:14px;font-size:20px}
.tx .tm b{font-weight:600;letter-spacing:-.01em}
.tx .ta{font-weight:700;letter-spacing:-.01em}
.dayhead{font-weight:600;color:var(--muted);margin:18px 6px 8px;font-size:12.5px}
.search{background:var(--card);border:1px solid var(--line);box-shadow:none;border-radius:16px;padding:13px 16px}
.list .row{padding:13px 0}
.list .row .tx1 b{font-weight:600}
.in{color:var(--green)}.danger{color:var(--red)!important}
.pend{color:var(--gold)}

/* Kalender */
.cd{border-radius:14px}
.cd .dn{font-weight:600}
.cd.has{background:color-mix(in srgb,var(--accent-2) calc(var(--heat) * 38%),var(--chip))}
.cd .dc{background:var(--card);color:var(--text);font-weight:700}
.cd.today{border-color:var(--accent)}

/* Dock navigasi mengambang */
nav.tabs{left:12px;right:12px;bottom:calc(var(--sab) + 10px);border-radius:28px;border:1px solid var(--line);background:var(--dock);
  padding:8px 6px;box-shadow:0 12px 32px -12px rgba(0,0,0,.35)}
nav.tabs button{font-weight:600;font-size:10.5px}
nav.tabs .add span{width:54px;height:54px;margin-top:-26px;background:var(--accent);color:var(--on-accent);font-weight:400;
  box-shadow:0 0 0 5px var(--bg),0 10px 24px -6px color-mix(in srgb,var(--accent) 60%,transparent)}
.toast{bottom:calc(var(--sab) + 100px);border-radius:14px;background:var(--text);color:var(--bg);font-weight:600}

/* Lembar bawah & form */
.overlay{background:rgba(3,10,8,.5);backdrop-filter:blur(2px)}
.sheet{border-radius:28px 28px 0 0;border-top:1px solid var(--line)}
.shead h2{font-weight:800;letter-spacing:-.02em}
.shead button{font-weight:600}
.field{border:1px solid var(--line);border-radius:16px}
.amount input{font-weight:800;letter-spacing:-.035em}
.cat{border-radius:16px;border:1.5px solid var(--line);font-weight:500}
.cat.on{border-color:var(--accent);background:var(--accent-soft)}
.btn{border-radius:18px;background:var(--accent);color:var(--on-accent);font-weight:700;letter-spacing:-.01em}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--red)}
.banner{border-radius:18px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.dialog .box{border-radius:22px;border:1px solid var(--line)}

/* ===== Form catat transaksi ===== */
/* Jendela dari bawah dengan tinggi tetap; keypad selalu di tempat yang sama */
.sheet.txsheet{top:calc(var(--sat) + 14px);max-height:none;border-radius:30px 30px 0 0;display:flex;flex-direction:column;
  padding:6px 14px calc(10px + var(--sab));background:var(--bg)}
.sheet.txsheet>*{flex-shrink:0}
.sheet .grab{cursor:grab;touch-action:none;padding:6px 0;margin:-2px auto 4px;width:40px;height:5px;box-sizing:content-box;background-clip:content-box}
.txtop{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.txtitle{font-size:15px;font-weight:700;color:var(--muted)}
.txtopbtns{display:flex;gap:8px}
.roundbtn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text)}
.roundbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#txDel{color:var(--red)}

/* Kartu utama */
.txcard{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:8px;display:flex;flex-direction:column;flex:1 0 auto}
.txcardtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 8px}
.seg.pillseg{margin:0;border-radius:999px;padding:3px;display:inline-grid;grid-template-columns:repeat(3,auto);background:var(--chip)}
.seg.pillseg button{border-radius:999px;padding:7px 13px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.seg.pillseg .dot{width:7px;height:7px}
.dot.b{background:#4E9BF0}
.txinner{background:var(--bg);border-radius:20px;padding:12px 10px 10px;display:flex;flex-direction:column;gap:8px;flex:1 0 auto}

/* Nominal */
.abig{display:flex;align-items:baseline;justify-content:center;gap:8px;cursor:text;padding:6px 0 0;border-radius:16px}
.abig.act{background:var(--accent-soft)}
.abig .acur{font-size:20px;font-weight:700;color:var(--muted)}
.abig input{width:2ch;max-width:calc(100vw - 110px);border:0;background:transparent;outline:none;text-align:left;font-size:44px;font-weight:800;letter-spacing:-.04em;padding:0;caret-color:var(--accent);min-width:1ch}
.abig input::placeholder{color:var(--muted);opacity:.45}
.amtsub{display:flex;justify-content:center;align-items:center;min-height:28px;margin-top:-4px}
.exprres{font-size:14px;font-weight:600;color:var(--muted)}
.exprres:empty{display:none}
.splitrow{display:none;align-items:center;gap:6px}
.splitrow.show{display:flex}
.exprres:not(:empty)+.splitrow{display:none}
.sp{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--text)}

/* Field berbentuk pil */
.pill{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:6px 12px 6px 14px;border-radius:999px;background:var(--chip);border:1.5px solid transparent;text-align:left;color:var(--text)}
.pill .pic{font-size:18px;width:22px;text-align:center;flex:0 0 auto}
.pill .pmain{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.pill .plab{font-size:11px;font-weight:600;color:var(--muted)}
.pill .pmain b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .pside{font-size:12px;white-space:nowrap;text-align:right}
.pill .pside b{font-weight:700}
.pchev{width:24px;height:24px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .2s}
.pchev svg{width:11px;height:11px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill.open .pchev{transform:rotate(180deg)}
.pill:focus-within,.pill.open{border-color:var(--accent)}
.pill select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;-webkit-appearance:none;appearance:none}
.npill input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;font-weight:500;padding:8px 0}
.npill input::placeholder{color:var(--muted)}
.tfpair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tfpair .pill{border-radius:18px;padding-left:12px}
.tfpair .pside{display:none}
.apill{cursor:text}
.apill.act{border-color:var(--accent);background:var(--accent-soft)}
.apill .pval{display:flex;align-items:baseline;gap:5px}
.apill .pval em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.apill input{border:0;background:transparent;outline:none;font-size:17px;font-weight:800;letter-spacing:-.02em;width:100%;min-width:0;padding:0}
.sheet .cats.catpanel{margin:0;padding:8px;border-radius:18px;background:var(--chip);grid-template-columns:repeat(4,1fr);gap:6px}
.catpanel .cat{background:var(--card);border-width:1.5px;padding:8px 2px;font-size:11px}
.catpanel .cat.addcat{background:transparent;border-style:dashed;color:var(--accent);font-weight:600}
.catpanel .cat.addcat .ce{font-size:20px;line-height:22px}
.cats[hidden]{display:none!important}
.suggrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-2px -10px 0;padding:0 10px}
.suggrow::-webkit-scrollbar{display:none}
.suggrow:empty{display:none}
.sug{flex:0 0 auto;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--text)}
.txhint{margin:0 4px;font-size:12px}

/* Tanggal & berulang */
.txdiv{height:1px;background:var(--line);margin:2px 6px}
.seg.dateseg{margin:0;border-radius:999px;padding:3px;grid-template-columns:repeat(3,1fr);background:var(--chip)}
.seg.dateseg>*{border-radius:999px;padding:8px 0;font-size:13.5px;font-weight:600;color:var(--muted);text-align:center;position:relative;display:block}
.seg.dateseg>.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}
#dateSeg input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.recrow{display:flex;gap:6px;justify-content:center}
.recrow[hidden]{display:none}
.rc{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;color:var(--text)}
.rc.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.txwhen{text-align:center;font-size:12.5px;color:var(--muted);font-weight:500;padding:0 0 2px}
.againrow{margin-top:auto;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 10px 8px 8px;color:var(--text);font:inherit;cursor:pointer}
.againrow .agic{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:17px;font-weight:700}
.againrow .agtx{flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:0}
.againrow .agtx b{font-size:14.5px;font-weight:600}
.againrow .agtx span{font-size:11.5px;color:var(--muted)}
.againrow .sw{width:44px;height:26px}.againrow .sw::after{width:20px;height:20px}.againrow .sw.on::after{transform:translateX(18px)}

/* Bawah: favorit + keypad */
.txbottom{padding-top:8px}
.favrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 8px;padding:0 14px}
.favrow::-webkit-scrollbar{display:none}
.favrow:empty{display:none}
.fav{flex:0 0 auto;height:32px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--text)}
.fav b{color:var(--muted);font-weight:700;margin-left:2px}
.fav.again.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.k{height:50px;border-radius:15px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.k:active{background:var(--chip);transform:scale(.97)}
.k.op{background:var(--chip);color:var(--accent);font-weight:700}
.k.dim{opacity:.3}
.k.ok{background:var(--accent);color:var(--on-accent);border-color:transparent;font-size:16px;font-weight:800}
@media (max-height:880px){.k{height:44px;font-size:20px}.abig input{font-size:38px}.pill{min-height:46px}.txinner{gap:6px;padding-top:8px}.amtsub{min-height:24px}.keypad{gap:6px}}
@media (max-height:740px){.k{height:40px}.pill{min-height:42px}.abig input{font-size:34px}}
@media (max-height:700px){.k{height:36px;font-size:18px}.keypad{gap:5px}.pill{min-height:40px}.txinner{gap:5px;padding-top:6px}.abig input{font-size:30px}.againrow{padding:4px 8px 4px 5px;border-radius:14px}.againrow .agic{width:26px;height:26px;font-size:14px}.againrow .agtx span{display:none}.txwhen{font-size:12px}.amtsub{min-height:18px}.txcard{padding:6px}}


@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================================================================
   SKIN v3 · "Hitam-Biru"
   Mayoritas hitam, tulisan putih, biru hanya sebagai aksen.
   Satu elemen yang menonjol: kartu saldo hitam→navy dengan cahaya biru.
   ================================================================ */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{
  --bg:#000000; --card:#101114; --chip:#1A1C21; --text:#F4F6FA; --muted:#8B919C; --line:#22252B;
  --accent:#3D8BFF; --accent-2:#6AA8FF; --accent-soft:#0F1E36; --on-accent:#FFFFFF;
  --red:#FF7A6E; --green:#4FD8A0; --gold:#F2B544;
  --hero-a:#0A1426; --hero-b:#000000; --hero-ink:#F4F6FA; --dock:rgba(18,19,23,.86);
  --shadow:none; color-scheme:dark;
}
.hero{background:repeating-radial-gradient(circle at 112% -18%, rgba(120,170,255,.08) 0 1px, transparent 1px 9px),repeating-radial-gradient(circle at -20% 120%, rgba(120,170,255,.05) 0 1px, transparent 1px 11px),radial-gradient(110% 85% at 88% 0%, #12357A 0%, transparent 58%),linear-gradient(160deg,var(--hero-a),var(--hero-b));box-shadow:inset 0 0 0 1px rgba(110,160,255,.16), 0 18px 40px -24px rgba(30,90,220,.55)}
.hero .split>div{background:rgba(255,255,255,.05);border-color:rgba(130,175,255,.14)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sw.on{background:var(--accent)}
nav.tabs .add span{box-shadow:0 8px 24px rgba(61,139,255,.45)}
</style>

<script>
(() => {
'use strict';
const KEY = 'dompetku.v1';
// ---------- Bahasa (Indonesia / English) ----------
// Teks ditulis dalam bahasa Indonesia; kalau bahasa = English, teks di layar diterjemahkan lewat kamus ini.
const LANG = (() => { try { return localStorage.getItem('dompetku.v1.lang') === 'en' ? 'en' : 'id'; } catch (e) { return 'id'; } })();
const LOC = LANG === 'en' ? 'en-GB' : 'id-ID';
try { document.documentElement.lang = LANG; } catch (e) {}
const DEC = LANG === 'en' ? '.' : ',';
const U = LANG === 'en' ? { k: 'k', m: 'M', b: 'B' } : { k: 'rb', m: 'jt', b: 'M' };
const EN = {

function tr(str) {
  if (LANG !== 'en' || !str) return str;
  const t = String(str).trim(); if (!t) return str;
  let r = EN[t];
  if (r == null) for (const [re, f] of EN_RE) { if (re.test(t)) { r = t.replace(re, f); break; } }
  if (r == null && t.includes(' · ')) { const p = t.split(' · ').map(x => EN[x] ?? tr(x)).join(' · '); if (p !== t) r = p; }
  if (r == null && t.includes(' → ')) { const p = t.split(' → ').map(x => EN[x] ?? x).join(' → '); if (p !== t) r = p; }
  if (r == null) { const m = t.match(/^([^\p{L}\p{N}]+)\s+(.+)$/u); if (m && EN[m[2]]) r = m[1] + ' ' + EN[m[2]]; }   // "💵 Tunai" 
  return r == null ? str : String(str).replace(t, r);
}
function trDOM(root) {
  if (LANG !== 'en' || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    if (n.parentElement && n.parentElement.closest('script,style,textarea,[data-notr]')) continue;
    const v = n.nodeValue; if (!v.trim()) continue;
    const x = tr(v); if (x !== v) n.nodeValue = x;
  }
  root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el => ['placeholder', 'aria-label', 'title'].forEach(a => {
    const v = el.getAttribute(a); if (v) { const x = tr(v); if (x !== v) el.setAttribute(a, x); }
  }));
}

let pulling = false, lastPull = 0;
async function pullInbox(manual) {
  if (!isLinked() || pulling) return;
  if (!manual && Date.now() - lastPull < 20000) return;
  pulling = true; lastPull = Date.now();
  try {
    // Back Tap masuk ke space yang dipilih di pengaturan Otomatis (default: space pertama)
    const sp = getSpaces();
    const tgt = sp.list.some(x => x.id === getSync().space) ? getSync().space : sp.list[0].id;
    const isActive = tgt === sp.active;
    const data = isActive ? S : loadSpace(tgt);
    const cats = { out: data.categories.filter(c => c.type === 'out').map(c => c.name), in: data.categories.filter(c => c.type === 'in').map(c => c.name) };
    const j = await api('pull', { categories: cats });
    const items = j.items || [];
    let added = 0;
    for (const it of items) {
      const id = 'bt_' + it.id;
      if (data.tx.some(t => t.id === id)) continue;
      const type = it.type === 'in' ? 'in' : 'out';
      const wid = mapWallet(it.app, it.currency, data);
      const wc = (data.wallets.find(w => w.id === wid) || {}).currency || 'IDR';
      data.tx.push({
        id, type, amount: roundC(it.amount, wc), cat: mapCat(it.category, type, data),
        wallet: wid, date: localDateOf(Date.parse(it.created) || Date.now()),   // tanggal saat Back Tap diketuk
        note: it.merchant || it.note || '', created: Date.parse(it.created) || Date.now(), src: 'auto'
      });
      added++;
    }
    if (items.length) await api('ack', { ids: items.map(i => i.id) });
    if (added) {
      if (isActive) { save(); render(); }
      else { saveSpace(tgt, data); doBackup(false, tgt, data); }
      toast(`⚡ ${added} transaksi baru dari Back Tap${isActive ? '' : ' → space ' + spaceInfo(tgt).name}`);
    }
    else if (manual) toast('Tidak ada transaksi baru');
  } catch (e) {
    if (manual) toast(e.message);
  } finally { pulling = false; }
}

function fileToJpegB64(file, max = 1600) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Gambar tidak bisa dibuka')); };
    img.src = url;
  });
}

// Transaksi kartu kredit yang belum lunas (pembayaran tagihan dialokasikan ke transaksi terlama dulu)
function pendingCC() {
  const pend = new Map();
  for (const w of S.wallets.filter(isCC)) {
    const charges = [], txs = S.tx.filter(t => t.wallet === w.id || t.toWallet === w.id);
    let paid = 0, debt0 = Math.max(0, -(Number(w.initial) || 0));
    for (const t of txs) {
      if (t.type === 'out' && t.wallet === w.id) charges.push(t);
      else if (t.type === 'transfer' && t.wallet === w.id) charges.push(t);   // tarik tunai / transfer dari CC
      else if (t.type === 'in' && t.wallet === w.id) paid += t.amount;        // refund
      else if (t.type === 'transfer' && t.toWallet === w.id) paid += inAmt(t); // bayar tagihan
    }
    paid -= Math.min(paid, debt0);
    charges.sort((a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0));
    for (const c of charges) {
      const cover = Math.min(paid, c.amount); paid -= cover;
      if (c.amount - cover > 0.004) pend.set(c.id, c.amount - cover);
    }
  }
  return pend;
}

function analyticsCard() {

  for (const t of txMonth(viewYM)) {

    const b = buckets[Math.floor((Number(t.date.slice(8, 10)) - 1) / 7)];
    if (t.type === 'out') b.out += t.amount; else b.inc += t.amount;
  }
  const max = niceMax(Math.max(...buckets.map(b => Math.max(b.out, b.inc))));
  const W = 340, H = 190, L = 44, B = 26, T = 8, ch = H - B - T, cw = (W - L) / buckets.length;
  let g = '';

  }
  buckets.forEach((b, i) => {
    const cx = L + cw * i + cw / 2, bw = Math.min(14, cw / 4);
    const ho = ch * b.out / max, hi = ch * b.inc / max;
    if (ho > 0) g += `<rect x="${cx - bw - 1.5}" y="${T + ch - ho}" width="${bw}" height="${ho}" rx="4" class="bo"/>`;
    if (hi > 0) g += `<rect x="${cx + 1.5}" y="${T + ch - hi}" width="${bw}" height="${hi}" rx="4" class="bi"/>`;
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" class="ax">${b.s === b.e ? b.s : b.s + '–' + b.e} ${mon}</text>`;
  });
  const isNow = viewYM === ymOf(todayStr());

  const upto = isNow ? new Date().getDate() : daysIn;

    <div class="cmp">

      <div><span class="small muted"><i class="dot g"></i>Pemasukan</span>${cmp(c1.inc, c0.inc, true)}<span class="small muted">vs ${fmtC(c0.inc, cur)} ${isNow ? 'periode sama ' : ''}bulan lalu</span></div>

}

let selDay = null;
const compactAmt = n => {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1).replace('.0', '').replace('.', DEC) + U.b;
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace('.0', '').replace('.', DEC) + U.m;
  if (a >= 1e3) return Math.round(n / 1e3) + U.k;
  return String(Math.round(n));
};

function walletBalanceAt(id, uptoDate) {
  const w = S.wallets.find(x => x.id === id);
  let b = w ? Number(w.initial) || 0 : 0;
  for (const t of S.tx) {
    if (t.date > uptoDate) continue;
    if (t.type === 'in' && t.wallet === id) b += t.amount;
    else if (t.type === 'out' && t.wallet === id) b -= t.amount;
    else if (t.type === 'transfer') { if (t.wallet === id) b -= t.amount; if (t.toWallet === id) b += inAmt(t); }
  }
  return roundC(b, w ? w.currency : 'IDR');

}

(function sheetDrag() {
  const sh = $('#sheet'), ov = $('#overlay');
  let y0 = null, x0 = 0, dy = 0, t0 = 0, dragging = false;
  const NO_DRAG = 'input,select,textarea,button.k,.catrow,.trow,.favrow,.suggrow,.splitrow,.icongrid,.cats,.chips';
  sh.addEventListener('touchstart', e => {
    y0 = null;
    if (!sh.classList.contains('show')) return;
    const t = e.target, onTop = t.closest('.grab,.txhead,.shead');
    if (!onTop && (t.closest(NO_DRAG) || sh.scrollTop > 0)) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; t0 = Date.now(); dragging = false;
  }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    const dx = Math.abs(e.touches[0].clientX - x0);
    if (!dragging) {
      if (dy > 8 && dy > dx) { dragging = true; sh.style.transition = 'none'; }
      else if (dy < -4 || dx > 10) { y0 = null; return; }
      else return;
    }
    e.preventDefault();
    sh.style.transform = `translateY(${Math.max(0, dy)}px)`;
    ov.style.opacity = String(Math.max(0, 1 - dy / 600));
  }, { passive: false });
  const end = () => {
    if (y0 == null) return; y0 = null;
    if (!dragging) return; dragging = false;
    const v = dy / Math.max(1, Date.now() - t0);
    sh.style.transition = 'transform .24s cubic-bezier(.2,.8,.2,1)';
    if (dy > 140 || (dy > 50 && v > .5)) {
      sh.style.transform = 'translateY(105%)'; ov.style.opacity = '';
      setTimeout(() => { closeSheet(); sh.style.transform = ''; sh.style.transition = ''; }, 240);
    } else {
      sh.style.transform = ''; ov.style.opacity = '';
      setTimeout(() => { sh.style.transition = ''; }, 260);
    }
  };
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
})();

function addPeriod(d, rec) {
  const [y, m, dd] = d.split('-').map(Number);
  if (rec.every === 'week') return localDateOf(new Date(y, m - 1, dd + 7).getTime());
  if (rec.every === 'year') return localDateOf(new Date(y + 1, m - 1, Math.min(rec.day || dd, new Date(y + 1, m, 0).getDate())).getTime());
  const last = new Date(y, m + 1, 0).getDate();
  return localDateOf(new Date(y, m, Math.min(rec.day || dd, last)).getTime());

    let cur = t, guard = 0;

      const nd = addPeriod(cur.date, cur.rec);
      if (nd > today) break;
      const copy = Object.assign({}, cur, { id: uid(), date: nd, created: Date.now(), recFrom: t.recFrom || t.id });
      delete copy.src;
      copy.rec = cur.rec; delete cur.rec;
      S.tx.push(copy); cur = copy; made++;

  const editing = !!D.id;
  const fw = walById(D.wallet), tw = walById(D.toWallet);
  const fc = fw.currency || 'IDR', tc = tw.currency || 'IDR';
  const isTf = D.type === 'transfer';
  const cross = isTf && fc !== tc;
  if (cross && !(D.rate > 0)) {
    D.rate = D.amount > 0 && D.toAmount > 0 ? calcRate(fc, tc, D.amount, D.toAmount) : (suggestRate(fc, tc) || 0);
    if (D.rate > 0 && D.amount > 0 && !(D.toAmount > 0)) D.toAmount = calcTo(fc, tc, D.amount, D.rate);
  }
  const qc = rateQuote(fc, tc), rDig = qc === 'IDR' ? 100 : 1e6;
  D.raw = D.raw || {};
  if (D.raw.amount === undefined) D.raw.amount = rawOf(D.amount);
  D.raw.toAmount = rawOf(D.toAmount);
  D.raw.rate = D.rate > 0 ? String(Math.round(D.rate * rDig) / rDig) : '';
  if (!cross || !['amount', 'rate', 'toAmount'].includes(D.active)) D.active = 'amount';
  const wOpts = sel => S.wallets.map(w => `<option value="${w.id}" ${w.id === sel ? 'selected' : ''}>${esc(w.icon)} ${esc(w.name)}${w.currency !== mainCur() ? ' · ' + w.currency : ''}</option>`).join('');
  const cats = isTf ? [] : catsByUse(D.type);
  const favs = !editing && !isTf ? favorites(D.type) : [];
  const isToday = D.date === todayStr();
  let note = '';
  if (!isTf && isCC(fw) && D.type === 'out') note = '💳 Pakai kartu kredit: tetap dihitung sebagai pengeluaran, tapi saldo tidak berkurang sampai tagihannya dibayar.';
  if (isTf && isCC(tw)) note = '💳 Bayar tagihan kartu kredit: tidak dihitung pengeluaran lagi (sudah tercatat saat belanja). Transaksi yang lunas otomatis hilang tanda ⏳-nya.';
  const decAllowed = f => f === 'rate' || decOf(f === 'toAmount' ? tc : fc) > 0;
  const walletPill = (id, sel, label) => `<label class="pill wpill" data-wpill="${id}">
      <span class="pic" id="${id}Ic">${esc(walById(sel).icon)}</span>
      <span class="pmain"><span class="plab">${label}</span><b id="${id}Nm">${esc(walById(sel).name)}</b></span>
      <span class="pside num" id="${id}Side"></span>${chev}
      <select id="${id}" aria-label="${label}">${wOpts(sel)}</select></label>`;

  openSheet(`
    <div class="txtop">
      <span class="txtitle">${editing ? 'Ubah transaksi' : 'Catat transaksi'}</span>
      <span class="txtopbtns">
        ${editing ? '<button id="txDel" class="roundbtn" aria-label="Hapus transaksi"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg></button>' : ''}
        <button id="txCancel" class="roundbtn" aria-label="Batal"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </span>
    </div>

    <div class="txcard">
      <div class="txcardtop">
        <div class="seg pillseg">${[['out', 'Keluar', 'r'], ['in', 'Masuk', 'g'], ['transfer', 'Transfer', 'b']].map(([k, l, c]) => `<button data-type="${k}" class="${D.type === k ? 'on' : ''}"><i class="dot ${c}"></i>${l}</button>`).join('')}</div>
        ${editing ? '' : '<button id="photoBtn" class="roundbtn" aria-label="Foto struk / pilih screenshot"><svg viewBox="0 0 16 16"><path d="M2.5 5.5h2l1-1.5h5l1 1.5h2v7h-11z"/><circle cx="8" cy="8.8" r="2.2"/></svg></button>'}
      </div>

      <div class="txinner">
        <label class="abig ${cross && D.active === 'amount' ? 'act' : ''}" data-act="amount"><span class="acur">${fc}</span><input id="fAmt" inputmode="none" autocomplete="off" placeholder="0" value="${esc(fmtExpr(D.raw.amount, fc))}" class="num" aria-label="${cross ? 'Dikirim' : 'Nominal'}"></label>
        <div class="amtsub"><span class="exprres num" id="exprRes"></span>
          ${cross ? '' : `<span class="splitrow" id="splitRow"><span class="small muted">Patungan</span>${[2, 3, 4, 5].map(n => `<button class="sp" data-split="${n}">÷${n}</button>`).join('')}</span>`}</div>

        <div class="pill npill"><span class="pic">✏️</span><input id="fNote" placeholder="${isTf ? 'Catatan (opsional)' : 'Judul, atau ketik cepat: kopi 25rb'}" value="${esc(D.note)}" autocomplete="off" autocapitalize="sentences"></div>
        <div class="suggrow" id="suggRow"></div>

        ${isTf ? '' : `<button class="pill cpill" id="catPill" aria-expanded="false">
            <span class="pic" id="catIc">${D.cat ? esc(catById(D.cat).icon) : '🏷️'}</span>
            <span class="pmain"><span class="plab">Kategori</span><b id="catNm">${D.cat ? esc(catById(D.cat).name) : 'Pilih kategori'}</b></span>
            <span class="pside num" id="catSide"></span>${chev}</button>
          <div class="cats catpanel" id="catGrid" hidden>${cats.map(c => `<button class="cat ${D.cat === c.id ? 'on' : ''}" data-pick="${c.id}"><span class="ce">${esc(c.icon)}</span>${esc(c.name)}</button>`).join('')}<button class="cat addcat" id="catAdd" aria-label="Tambah kategori"><span class="ce">＋</span>Tambah</button></div>`}

        ${isTf ? `<div class="tfpair">${walletPill('fWal', D.wallet, 'Dari')}${walletPill('fTo', D.toWallet, 'Ke')}</div>` : walletPill('fWal', D.wallet, 'Dompet / kartu')}

        ${cross ? `<div class="tfpair">
            <label class="pill apill ${D.active === 'rate' ? 'act' : ''}" data-act="rate"><span class="pmain"><span class="plab">Kurs 1 ${rateBase(fc, tc)}</span><span class="pval"><em>${qc}</em><input id="fRate" inputmode="none" autocomplete="off" placeholder="0" value="${esc(fmtRawNum(D.raw.rate, qc))}" class="num"></span></span></label>
            <label class="pill apill ${D.active === 'toAmount' ? 'act' : ''}" data-act="toAmount"><span class="pmain"><span class="plab">Diterima</span><span class="pval"><em>${tc}</em><input id="fToAmt" inputmode="none" autocomplete="off" placeholder="0" value="${esc(fmtRawNum(D.raw.toAmount, tc))}" class="num"></span></span></label>
          </div>` : ''}
        ${note ? `<div class="hint txhint">${note}</div>` : ''}

        <div class="txdiv"></div>
        <div class="seg dateseg">
          <button data-dq="today" class="${isToday && !D.recOpen ? 'on' : ''}">Hari ini</button>
          <label class="${!isToday && !D.recOpen ? 'on' : ''}" id="dateSeg"><span id="dateLbl">${isToday ? 'Pilih tanggal' : esc(dateChipLabel(D.date))}</span><input id="fDate" type="date" value="${D.date}" aria-label="Tanggal"></label>
          <button data-dq="rec" class="${D.recOpen ? 'on' : ''}">${D.rec ? '🔁 ' + REC_LABEL[D.rec.every] : 'Berulang'}</button>
        </div>
        <div class="recrow" id="recRow" ${D.recOpen ? '' : 'hidden'}>${[['', 'Tidak'], ['week', 'Mingguan'], ['month', 'Bulanan'], ['year', 'Tahunan']].map(([k, l]) => `<button class="rc ${(D.rec ? D.rec.every : '') === k ? 'on' : ''}" data-rec="${k}">${l}</button>`).join('')}</div>
        <div class="txwhen" id="txWhen"></div>
        ${editing ? '' : `<button class="againrow" id="againBtn" role="switch" aria-checked="${againOn()}"><span class="agic">↻</span><span class="agtx"><b>Catat lagi</b><span>Form tetap terbuka setelah simpan</span></span><span class="sw ${againOn() ? 'on' : ''}"></span></button>`}
      </div>
    </div>

    <div class="txbottom">
      <div class="favrow">${favs.map((t, i) => `<button class="fav" data-fav="${i}">⭐ ${esc(t.note)} <b class="num">${esc(fmtShortC(t.amount, curOf(t.wallet)))}</b></button>`).join('')}</div>
      <div class="keypad" role="group" aria-label="Keypad nominal">
        ${['1', '2', '3', 'del', '4', '5', '6', '+', '7', '8', '9', '-'].map(k => `<button class="k ${'del+-'.includes(k) ? 'op' : ''}" data-k="${k}" aria-label="${k === 'del' ? 'Hapus angka' : k}">${k === 'del' ? '⌫' : k === '-' ? '−' : k}</button>`).join('')}
        <button class="k" data-k="000">000</button><button class="k" data-k="0">0</button>
        <button class="k ${decAllowed(D.active) ? '' : 'dim'}" data-k=".">${DEC}</button>
        <button class="k ok" id="txSave2" aria-label="Simpan">${editing ? 'Simpan' : 'Selesai'}</button>
      </div>
    </div>
  `);
  const sh = $('#sheet');
  sh.classList.add('txsheet');
  const old = editing ? S.tx.find(x => x.id === D.id) : null;
  const effectOn = (t, wid) => !t ? 0 : t.type === 'in' && t.wallet === wid ? t.amount : t.type === 'out' && t.wallet === wid ? -t.amount
    : t.type === 'transfer' ? (t.wallet === wid ? -t.amount : 0) + (t.toWallet === wid ? inAmt(t) : 0) : 0;

  // Info di dalam pil: saldo dompet sebelum → sesudah, dan sisa budget / total kategori bulan ini
  const sideWallet = (wid, delta) => {
    const w = walById(wid), c = w.currency || 'IDR';
    const before = walletBalance(wid) - effectOn(old, wid), after = before + delta;
    if (isCC(w)) return `<span class="muted">Tagihan</span> ${fmtShortC(Math.max(0, -after), c)}`;
    return `<span class="muted">${fmtShortC(before, c)} →</span> <b class="${after < 0 ? 'danger' : ''}">${fmtShortC(after, c)}</b>`;
  };
  const updateMid = () => {
    const amt = D.amount > 0 ? D.amount : 0;
    if (isTf) {
      $('#fWalSide').innerHTML = sideWallet(D.wallet, -amt);
      $('#fToSide').innerHTML = sideWallet(D.toWallet, cross ? (D.toAmount > 0 ? D.toAmount : 0) : amt);
    } else {
      $('#fWalSide').innerHTML = sideWallet(D.wallet, D.type === 'in' ? amt : -amt);
      const cs = $('#catSide'); cs.innerHTML = ''; cs.classList.remove('warn', 'over');
      if (D.cat) {
        const ym = ymOf(D.date || todayStr());
        const b = D.type === 'out' && budgetOn() ? S.budgets[D.cat] || 0 : 0;
        if (b) {
          const spent = (budgetSpent(ym).by[D.cat] || 0) - (old && old.cat === D.cat && ymOf(old.date) === ym ? (convert(old.amount, curOf(old.wallet), budCur()) || 0) : 0);
          const left = b - spent - (convert(amt, fc, budCur()) || 0);
          cs.innerHTML = `<span class="muted">Sisa</span> <b class="${left < 0 ? 'danger' : ''}">${fmtShortC(left, budCur())}</b>`;
        } else {
          const sum = S.tx.filter(t => t.cat === D.cat && t.type === D.type && ymOf(t.date) === ym && t.id !== D.id && curOf(t.wallet) === fc).reduce((a, t) => a + t.amount, 0);
          cs.innerHTML = `<span class="muted">Bulan ini</span> <b>${fmtShortC(sum + amt, fc)}</b>`;
        }
      }
    }
    // Tanggal lengkap + info berulang
    const d = new Date(D.date + 'T00:00');
    let when = d.toLocaleDateString(LOC, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    if (isToday && !editing) when = new Date().toLocaleTimeString(LOC, { hour: '2-digit', minute: '2-digit' }) + ' · ' + when;
    if (D.rec) when += ' · ' + tr('berikutnya') + ' ' + new Date(addPeriod(D.date, D.rec) + 'T00:00').toLocaleDateString(LOC, { day: 'numeric', month: 'short', year: 'numeric' });
    $('#txWhen').textContent = when;
    trDOM(sh.querySelector('.txinner'));
    // Saran catatan saat kolom catatan dipakai
    const sg = $('#suggRow');
    const nEl = $('#fNote'), q = nEl.value.trim().toLowerCase();
    if (document.activeElement !== nEl && !q) { sg.innerHTML = ''; return; }
    const seen = new Set(), list = [];
    for (const t of sortTx(S.tx)) {
      if (t.type !== D.type || !t.note || (D.cat && t.cat !== D.cat && !q)) continue;
      const k = t.note.toLowerCase(); if (seen.has(k) || k === q) continue;
      if (q && !k.includes(q)) continue;
      seen.add(k); list.push(t); if (list.length >= 8) break;
    }
    sg.innerHTML = list.map((t, i) => `<button class="sug" data-sug="${i}">${esc(t.note)}</button>`).join('');
    sg.querySelectorAll('[data-sug]').forEach(b => b.onmousedown = b.ontouchstart = ev => ev.preventDefault());
    sg.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => {
      const t = list[Number(b.dataset.sug)];
      nEl.value = t.note; D.note = t.note; D.qrest = null;
      if (!D.catManual && t.cat && t.type === D.type) setCat(t.cat, false);
      sg.innerHTML = ''; nEl.blur(); updateMid();
    });
  };
  D._upd = updateMid;
  const setCat = (id, manual) => {
    D.cat = id; if (manual) D.catManual = true;
    const c = catById(id);
    if ($('#catIc')) { $('#catIc').textContent = c.icon; $('#catNm').textContent = tr(c.name); }
    sh.querySelectorAll('[data-pick]').forEach(x => x.classList.toggle('on', x.dataset.pick === id));
  };
  D._setCat = setCat;

  // Nominal & keypad
  const sizeAmt = () => {
    const el = $('#fAmt'); const L = Math.max(1, el.value.length);
    el.style.fontSize = L > 16 ? '28px' : L > 12 ? '34px' : '';
    el.style.width = (L + 0.4) + 'ch';
  };
  const showRes = () => {
    $('#exprRes').textContent = /[+-]/.test(D.raw.amount || '') ? '= ' + fmtC(D.amount, fc) : '';
    const sr = $('#splitRow'); if (sr) sr.classList.toggle('show', D.amount > 0 && !/[+-]/.test(D.raw.amount || ''));
  };
  const paint = () => {
    $('#fAmt').value = fmtExpr(D.raw.amount, fc);
    if ($('#fRate')) $('#fRate').value = fmtRawNum(D.raw.rate, qc);
    if ($('#fToAmt')) $('#fToAmt').value = fmtRawNum(D.raw.toAmount, tc);
    sh.querySelectorAll('[data-act]').forEach(x => x.classList.toggle('act', cross && x.dataset.act === D.active));
    const dk = sh.querySelector('[data-k="."]'); if (dk) dk.classList.toggle('dim', !decAllowed(D.active));
    sizeAmt(); showRes(); updateMid();
  };
  const apply = f => {
    if (f === 'amount') {
      D.amount = evalExpr(D.raw.amount, fc);
      if (cross && D.rate > 0) { D.toAmount = calcTo(fc, tc, D.amount, D.rate); D.raw.toAmount = rawOf(D.toAmount); }
    } else if (f === 'rate') {
      D.rate = Number(D.raw.rate) || 0;
      if (D.rate > 0 && D.amount > 0) { D.toAmount = calcTo(fc, tc, D.amount, D.rate); D.raw.toAmount = rawOf(D.toAmount); }
    } else if (f === 'toAmount') {
      D.toAmount = roundC(Number(D.raw.toAmount) || 0, tc);
      if (D.amount > 0 && D.toAmount > 0) { D.rate = calcRate(fc, tc, D.amount, D.toAmount); D.raw.rate = String(Math.round(D.rate * rDig) / rDig); }
    }
    paint();
  };
  const press = k => {
    const f = D.active;
    let r = D.raw[f] || '';
    const last = r.split(/[+-]/).pop();
    const maxDec = f === 'rate' ? 6 : decOf(f === 'toAmount' ? tc : fc);
    if (k === 'del') r = r.slice(0, -1);
    else if (k === '+' || k === '-') { if (f !== 'amount' || !r) return; r = r.replace(/[+-]$/, '') + k; }
    else if (k === '.') { if (!maxDec || last.includes('.')) return; r += last === '' ? '0.' : '.'; }
    else {
      if (last.includes('.') && last.split('.')[1].length + k.length > maxDec) return;
      if (k === '000' && (last === '' || last === '0')) return;
      if (last === '0') r = r.slice(0, -1);
      if (last.replace('.', '').length >= 13) return;
      r += k;
    }
    D.raw[f] = r; apply(f);
  };
  sh.querySelectorAll('[data-k]').forEach(b => b.onclick = () => press(b.dataset.k));
  sh.querySelectorAll('[data-act]').forEach(x => x.addEventListener('click', () => { D.active = x.dataset.act; paint(); }));
  const typed = (el, f, cur) => el.addEventListener('input', () => {
    const v = f === 'rate' ? parseRate(el.value, qc) : parseAmt(el.value.replace(/[+−-].*$/, ''), cur);
    D.raw[f] = rawOf(v); D.active = f; apply(f);
  });
  typed($('#fAmt'), 'amount', fc);
  if ($('#fRate')) typed($('#fRate'), 'rate', qc);
  if ($('#fToAmt')) typed($('#fToAmt'), 'toAmount', tc);
  sh.querySelectorAll('[data-split]').forEach(b => b.onclick = () => {
    const n = Number(b.dataset.split); if (!(D.amount > 0)) return;
    D.raw.amount = rawOf(roundC(D.amount / n, fc)); apply('amount');
    toast(`Dibagi ${n}: ${fmtC(D.amount, fc)} per orang`);
  });
  paint();

  // Jenis, kategori, dompet, tanggal, berulang
  sh.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { syncFields(); D.type = b.dataset.type; if (D.cat && catById(D.cat).type !== D.type) D.cat = null; if (D.type === 'transfer') D.rec = D.rec; renderTxSheet(); });
  if ($('#catPill')) $('#catPill').onclick = () => { const g = $('#catGrid'); g.hidden = !g.hidden; $('#catPill').setAttribute('aria-expanded', String(!g.hidden)); $('#catPill').classList.toggle('open', !g.hidden); };
  if ($('#catAdd')) $('#catAdd').onclick = () => {
    syncFields();
    openCat('new', { type: D.type, back: id => { if (id) { D.cat = id; D.catManual = true; } renderTxSheet(); } });
  };
  sh.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { setCat(b.dataset.pick, true); $('#catGrid').hidden = true; $('#catPill').classList.remove('open'); updateMid(); });
  const pairChange = () => {
    const before = curOf(D.wallet) + curOf(D.toWallet);
    syncFields();
    if (curOf(D.wallet) + curOf(D.toWallet) !== before) { D.rate = 0; D.toAmount = undefined; D.raw = { amount: rawOf(D.amount) }; }
    renderTxSheet();
  };
  $('#fWal').onchange = pairChange;
  if ($('#fTo')) $('#fTo').onchange = pairChange;
  $('#fDate').onclick = e => { if (!isIOS() && e.target.showPicker) { try { e.target.showPicker(); } catch (err) {} } };
  $('#fDate').onchange = () => { D.date = $('#fDate').value || todayStr(); D.recOpen = false; syncFields(); renderTxSheet(); };
  sh.querySelectorAll('[data-dq]').forEach(b => b.onclick = () => {
    syncFields();
    if (b.dataset.dq === 'today') { D.date = todayStr(); D.recOpen = false; }
    else D.recOpen = !D.recOpen;
    renderTxSheet();
  });
  sh.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => {
    syncFields();
    const k = b.dataset.rec;
    D.rec = k ? { every: k, day: Number(D.date.slice(8, 10)) } : null;
    D.recOpen = false; renderTxSheet();
  });
  const nEl = $('#fNote');
  nEl.oninput = () => quickParse(nEl.value);
  nEl.onfocus = () => updateMid();
  nEl.onblur = () => setTimeout(() => { if (document.activeElement !== nEl) { $('#suggRow').innerHTML = ''; } }, 150);
  sh.querySelectorAll('[data-fav]').forEach(b => b.onclick = () => {
    const t = favs[Number(b.dataset.fav)];
    D.amount = t.amount; D.raw.amount = rawOf(t.amount); D.cat = t.cat; D.catManual = true; D.wallet = t.wallet; D.note = t.note; D.qrest = null;
    renderTxSheet(); toast('Terisi dari favorit, tinggal ✓');
  });
  if ($('#againBtn')) $('#againBtn').onclick = () => {
    const on = !againOn(); try { localStorage.setItem(KEY + '.again', on ? '1' : '0'); } catch (e) {}
    $('#againBtn .sw').classList.toggle('on', on); $('#againBtn').setAttribute('aria-checked', String(on));
    toast(on ? 'Catat lagi aktif: form tetap terbuka setelah simpan' : 'Catat lagi mati');
  };
  const pb = $('#photoBtn');
  if (pb) pb.onclick = () => {
    if (!isLinked()) { toast('Atur dulu di Lainnya → Fitur → Back Tap & Foto struk'); return; }
    $('#photoIn').click();
  };
  $('#txCancel').onclick = closeSheet;
  $('#txSave2').onclick = saveTx;
  if ($('#txDel')) $('#txDel').onclick = async () => {
    if (await ask('Hapus transaksi ini?')) { S.tx = S.tx.filter(x => x.id !== D.id); save(); closeSheet(); render(); toast('Transaksi dihapus'); }
  };
}
function syncFields() {
  // Nominal sudah tersimpan di D lewat keypad; di sini cukup ambil dompet, tanggal, dan catatan
  if ($('#fWal')) D.wallet = $('#fWal').value;
  if ($('#fTo')) D.toWallet = $('#fTo').value;
  if ($('#fDate')) D.date = $('#fDate').value || todayStr();
  if ($('#fNote')) D.note = $('#fNote').value.trim();
}
// Ketik cepat di kolom catatan: "kopi 25rb" → nominal 25.000, kategori Makan & Minum, catatan "Kopi"
function quickParse(text) {
  quickParse0(text);
  if (D._upd) D._upd();
}
function quickParse0(text) {
  D.note = text.trim(); D.qrest = null;
  const s = text.toLowerCase();
  const cur = curOf(D.wallet);
  const m = s.match(/(\d+(?:[.,]\d+)*)\s*(rb|ribu|k|jt|juta)?\b/);
  if (m && D.type !== 'transfer') {
    const numStr = m[1], unit = m[2];
    let amount;
    if (unit) amount = roundC(parseFloat(numStr.replace(/\./g, '').replace(',', '.')) * (/^(jt|juta)$/.test(unit) ? 1e6 : 1e3), cur);
    else amount = parseAmt(numStr, cur);
    if (amount > 0) {
      const rest = (text.slice(0, m.index) + text.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim();
      D.qrest = rest ? rest[0].toUpperCase() + rest.slice(1) : '';
      D.amount = amount; D.raw.amount = rawOf(amount); D.active = 'amount';
      const a = $('#fAmt'); if (a) { a.value = fmtExpr(D.raw.amount, cur); a.style.width = (a.value.length + 0.4) + 'ch'; a.style.fontSize = ''; }
      const r = $('#exprRes'); if (r) r.textContent = '';
      const sr = $('#splitRow'); if (sr) sr.classList.add('show');
    }
  }
  if (D.type === 'transfer' || D.catManual) return;   // kategori yang dipilih sendiri tidak ditimpa
  let found = null;
  for (const [cid, words] of Object.entries(KEYWORDS)) {
    if (words.some(w => new RegExp('(^|\\s)' + w.replace(/\s+/g, '\\s+') + '($|\\s)').test(s))) { found = cid; break; }
  }
  const fcat = found && S.categories.find(c => c.id === found);
  if (!fcat) return;
  if (fcat.type !== D.type) {
    // mis. "gaji 8jt" → pindah ke Pemasukan
    syncFields(); const keepRest = D.qrest; D.type = fcat.type; D.cat = fcat.id;
    renderTxSheet(); D.qrest = keepRest;
    const n = $('#fNote'); if (n) { n.value = text; n.focus(); }
    return;
  }
  if (D._setCat) D._setCat(fcat.id, false); else D.cat = fcat.id;
}
function saveTx() {
  syncFields();
  if (D.qrest != null) D.note = D.qrest;            // "kopi 25rb" → simpan catatan "Kopi"
  const fc = curOf(D.wallet), tc = curOf(D.toWallet);
  const cross = D.type === 'transfer' && fc !== tc;
  if (!(D.amount > 0)) { toast('Isi nominal dulu'); return; }
  if (D.type !== 'transfer' && !D.cat) { toast('Pilih kategori'); const g = $('#catGrid'); if (g) { g.hidden = false; $('#catPill').classList.add('open'); } return; }
  if (D.type === 'transfer' && D.wallet === D.toWallet) { toast('Dompet asal dan tujuan harus beda'); return; }
  if (cross && !(D.toAmount > 0)) { toast(`Isi nominal yang diterima (${tc})`); D.active = 'toAmount'; renderTxSheet(); return; }
  const rec = { id: D.id || uid(), type: D.type, amount: D.amount, wallet: D.wallet, date: D.date, note: D.note, created: D.created || Date.now() };
  if (D.type === 'transfer') { rec.toWallet = D.toWallet; if (cross) rec.toAmount = D.toAmount; }
  else rec.cat = D.cat;
  if (D.src) rec.src = D.src;
  if (D.rec) rec.rec = D.rec;
  if (D.recFrom) rec.recFrom = D.recFrom;
  // Simpan kurs dari transfer ini (dipakai untuk menyatukan budget)
  let rateMsg = '';
  if (cross) {
    const q = calcRate(fc, tc, rec.amount, rec.toAmount);
    if (fc === 'IDR') S.rates[tc] = q;
    else if (tc === 'IDR') S.rates[fc] = q;
    else if (rateIDR(fc)) S.rates[tc] = rateIDR(fc) / q;
    else if (rateIDR(tc)) S.rates[fc] = rateIDR(tc) * q;
    rateMsg = ` · kurs 1 ${rateBase(fc, tc)} = ${rateQuote(fc, tc) === 'IDR' ? fmt(q) : fmtRate(q, tc) + ' ' + tc}`;
  }
  const i = S.tx.findIndex(x => x.id === rec.id);
  if (i >= 0) S.tx[i] = rec; else S.tx.push(rec);
  try { localStorage.setItem(KEY + '.lastWallet', rec.wallet); } catch (e) {}
  save();
  if (rec.rec) runRecurring();      // tanggal lampau + berulang → isi otomatis sampai hari ini
  viewYM = ymOf(rec.date);
  const msg = (i >= 0 ? 'Perubahan disimpan' : 'Tercatat ' + fmtC(rec.amount, fc)) + rateMsg;
  if (i < 0 && againOn()) {
    // Mode catat lagi: form langsung siap untuk transaksi berikutnya (dompet, tanggal, jenis tetap)
    const keep = { type: rec.type, wallet: rec.wallet, toWallet: D.toWallet, date: rec.date };
    render(); D = { type: keep.type, amount: 0, cat: null, wallet: keep.wallet, toWallet: keep.toWallet, date: keep.date, note: '' };
    renderTxSheet(); toast(msg);
    return;
  }
  closeSheet(); render(); toast(msg);
}
